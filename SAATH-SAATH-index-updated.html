
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAATH-SAATH</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaf5ef;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 15px;
}
.container {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 28px 22px;
  border-radius: 22px;
  box-shadow: 0 5px 25px #0002;
  text-align: center;
}
.logo {
  font-size: 32px;
  font-weight: bold;
  color: #15965b;
  margin-bottom: 8px;
}
.subtitle {
  color: #777;
  margin-bottom: 25px;
}
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.tabs button {
  flex: 1;
  background: #eaf5ef;
  color: #15965b;
  padding: 12px 5px;
}
.tabs button.active {
  background: #15965b;
  color: white;
}
input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  background: #15965b;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 12px;
  cursor: pointer;
}
button:disabled {
  opacity: .5;
}
.link {
  color: #15965b;
  cursor: pointer;
  margin-top: 18px;
}
.message {
  font-size: 14px;
  margin-top: 15px;
  color: #15965b;
  overflow-wrap: anywhere;
}
.hidden {
  display: none;
}
#recaptcha-container {
  margin-top: 12px;
  display: flex;
  justify-content: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">❤️ SAATH-SAATH</div>
  <h2>आपका स्वागत है!</h2>
  <p class="subtitle">अपनों से जुड़े रहें हमेशा</p>

  <div class="tabs">
    <button id="emailTab" class="active">ईमेल लॉगिन</button>
    <button id="phoneTab">मोबाइल OTP</button>
  </div>

  <!-- EMAIL LOGIN -->

  <div id="emailBox">

    <input id="email" type="email"
    placeholder="अपना ईमेल लिखें">

    <input id="password" type="password"
    placeholder="पासवर्ड लिखें">

    <button id="loginBtn">लॉगिन करें</button>

    <button id="signupBtn">नया अकाउंट बनाएँ</button>

  </div>

  <!-- PHONE LOGIN -->

  <div id="phoneBox" class="hidden">

    <input id="phone" type="tel"
    placeholder="मोबाइल नंबर (+91 सहित)">

    <div id="recaptcha-container"></div>

    <button id="sendOtpBtn">OTP भेजें</button>

    <div id="otpBox" class="hidden">
      <input id="otp" type="number"
      placeholder="OTP दर्ज करें">

      <button id="verifyOtpBtn">OTP सत्यापित करें</button>
    </div>

  </div>

  <p id="message" class="message">
    SAATH-SAATH में आपका स्वागत है ❤️
  </p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  RecaptchaVerifier,
  signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// अपनी Firebase जानकारी यहाँ भरें

const firebaseConfig = {
  apiKey: "AIzaSyCrLbFn_u0ClPcJYpUqghU_ekPQo1C1iv8",
  authDomain: "saath-saath-9704f.firebaseapp.com",
  projectId: "saath-saath-9704f",
  storageBucket: "saath-saath-9704f.firebasestorage.app",
  messagingSenderId: "1077403082508",
  appId: "1:1077403082508:web:37a9826ba58baae71c3329",
  measurementId: "G-PFTLZHX3XC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const emailTab = document.getElementById("emailTab");
const phoneTab = document.getElementById("phoneTab");
const emailBox = document.getElementById("emailBox");
const phoneBox = document.getElementById("phoneBox");
const message = document.getElementById("message");

function showMessage(text) {
  message.textContent = text;
}

// ईमेल लॉगिन और मोबाइल OTP के बीच बदलाव

emailTab.onclick = () => {
  emailBox.classList.remove("hidden");
  phoneBox.classList.add("hidden");
  emailTab.classList.add("active");
  phoneTab.classList.remove("active");
};

phoneTab.onclick = () => {
  emailBox.classList.add("hidden");
  phoneBox.classList.remove("hidden");
  phoneTab.classList.add("active");
  emailTab.classList.remove("active");
};

// नया अकाउंट बनाएँ

document.getElementById("signupBtn").onclick =
async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("ईमेल और पासवर्ड भरें");
    return;
  }

  try {
    await createUserWithEmailAndPassword(
      auth, email, password
    );
    showMessage("आपका अकाउंट बन गया! ❤️");
  } catch(error) {
    showMessage(error.message);
  }
};

// ईमेल से लॉगिन

document.getElementById("loginBtn").onclick =
async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("ईमेल और पासवर्ड भरें");
    return;
  }

  try {
    await signInWithEmailAndPassword(
      auth, email, password
    );
    showMessage("लॉगिन सफल हुआ ❤️");
  } catch(error) {
    showMessage(error.message);
  }
};

// मोबाइल OTP

let confirmationResult = null;
let verifier = null;

document.getElementById("sendOtpBtn").onclick =
async () => {
  const phone = document.getElementById("phone").value.trim();

  if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
    showMessage("देश के कोड सहित नंबर लिखें, जैसे +919876543210");
    return;
  }

  try {
    if (!verifier) {
      verifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal"
        }
      );
    }

    confirmationResult = await signInWithPhoneNumber(
      auth, phone, verifier
    );

    document.getElementById("otpBox")
      .classList.remove("hidden");

    showMessage("OTP भेज दिया गया है।");
  } catch(error) {
    if (verifier) {
      verifier.clear();
      verifier = null;
    }
    showMessage(error.message);
  }
};

// OTP सत्यापित करें

document.getElementById("verifyOtpBtn").onclick =
async () => {
  const otp = document.getElementById("otp").value.trim();

  if (!confirmationResult || !otp) {
    showMessage("सही OTP दर्ज करें");
    return;
  }

  try {
    await confirmationResult.confirm(otp);
    showMessage("मोबाइल लॉगिन सफल हुआ ❤️");
  } catch(error) {
    showMessage("OTP गलत है या समाप्त हो गया है");
  }
};

// लॉगिन की स्थिति

onAuthStateChanged(auth, user => {
  if(user) {
    showMessage("आप लॉगिन हैं: " + user.email);
  }
});

</script>

</body>
</html>
